<!doctype html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>My project</title>
    <link rel="stylesheet" href="index.css">
    <link rel="stylesheet"
          href="https://fonts.googleapis.com/css2?family=Jost:ital,wght@0,100..900;1,100..900&display=swap">
</head>
<body>
<div class="page-container page-container_main">
    <h2 class="page-container__header">React To-Do List</h2>
    <div class="page-container__content">
        <div class="toolbar page-container__toolbar">
            <div class="toolbar__left">
                <a href="form.html" class="button toolbar__main-button button_no-decoration">Add a new to-do</a>
            </div>
            <div class="toolbar__right" id="toolbar-right">
            </div>
        </div>
            <table class="table">
                <tr class="table__row">
                    <th class="table__cell table__cell_header table__cell_action"></th>
                    <th class="table__cell table__cell_header">Task</th>
                    <th class="table__cell table__cell_header table__cell_wide">Description</th>
                    <th class="table__cell table__cell_header">Category</th>
                    <th class="table__cell table__cell_header">When</th>
                    <th class="table__cell table__cell_header">Time</th>
                    <th class="table__cell table__cell_header">Priority</th>
                    <th class="table__cell table__cell_header">Fulfillment</th>
                    <th class="table__cell table__cell_header table__cell_action"></th>
                    <th class="table__cell table__cell_header table__cell_action"></th>
                </tr>
                <tbody id="table-body">
                </tbody>
            </table>
    </div>
</div>
<script src="index.js"></script>
</body>
</html>
